trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - '*'

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
  dotnetVersion: '10.0.x'

jobs:
  - job: build_test_report
    displayName: Build, Test, Report
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        displayName: Setup .NET
        inputs:
          version: $(dotnetVersion)

      - task: Cache@2
        displayName: Cache NuGet packages
        inputs:
          key: 'nuget | "$(Agent.OS)" | **/*.csproj, **/global.json'
          restoreKeys: |
            nuget | "$(Agent.OS)"
          path: $(NUGET_PACKAGES)

      - script: dotnet restore
        displayName: Restore dependencies

      - script: dotnet build --no-restore --configuration Release
        displayName: Build

      - script: |
          mkdir -p "$HOME/.aspnet/https"
          dotnet dev-certs https -ep "$HOME/.aspnet/https/devcert.crt" --format PEM --no-password
          sudo cp "$HOME/.aspnet/https/devcert.crt" /usr/local/share/ca-certificates/dotnet-devcert.crt
          sudo update-ca-certificates
        displayName: Trust ASP.NET Core dev certificate

      - script: dotnet test --configuration Release --no-build --results-directory ./TestResults -- --coverage --report-trx --treenode-filter "/*/*/*/*[Category=UnitTest]" --coverage-output-format cobertura --ignore-exit-code 8
        displayName: Run unit tests with coverage
        continueOnError: true

      - script: dotnet test --configuration Release --no-build --results-directory ./TestResults -- --coverage --report-trx --treenode-filter "/*/*/*/*[Category=Components]" --coverage-output-format cobertura --ignore-exit-code 8
        displayName: Run Blazor component tests with coverage
        continueOnError: true

      - script: dotnet test --configuration Release --no-build --results-directory ./TestResults -- --coverage --report-trx --treenode-filter "/*/*/*/*[Category=Integration]" --coverage-output-format cobertura --ignore-exit-code 8
        displayName: Run integration tests with coverage
        continueOnError: true

      - script: dotnet test --configuration Release --no-build --results-directory ./TestResults -- --coverage --report-trx --treenode-filter "/*/*/*/*[Category=AppHost]" --coverage-output-format cobertura --ignore-exit-code 8
        displayName: Run Aspire tests with coverage
        continueOnError: true
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'true'

      - task: CopyFiles@2
        displayName: Stage TRX files
        condition: succeededOrFailed()
        inputs:
          sourceFolder: $(System.DefaultWorkingDirectory)/TestResults
          contents: '**/*.trx'
          targetFolder: $(Build.ArtifactStagingDirectory)/trx

      - publish: $(Build.ArtifactStagingDirectory)/trx
        artifact: trx
        displayName: Upload TRX artifact
        condition: succeededOrFailed()

      - task: CopyFiles@2
        displayName: Stage coverage files
        condition: succeededOrFailed()
        inputs:
          sourceFolder: $(System.DefaultWorkingDirectory)/TestResults
          contents: '**/*.cobertura.xml'
          targetFolder: $(Build.ArtifactStagingDirectory)/coverage

      - publish: $(Build.ArtifactStagingDirectory)/coverage
        artifact: coverage
        displayName: Upload coverage artifact
        condition: succeededOrFailed()

      - task: reportgenerator@5
        displayName: Generate combined coverage report
        condition: succeededOrFailed()
        inputs:
          reports: $(System.DefaultWorkingDirectory)/TestResults/**/*.cobertura.xml
          targetdir: $(Build.ArtifactStagingDirectory)/CoverageReport
          reporttypes: HtmlInline_AzurePipelines;Cobertura
          title: TUnit.Sample

      - task: PublishCodeCoverageResults@2
        displayName: Publish merged coverage
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: $(Build.ArtifactStagingDirectory)/CoverageReport/Cobertura.xml
          pathToSources: $(Build.SourcesDirectory)

      - task: PublishTestResults@2
        displayName: Publish merged test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '**/*.trx'
          searchFolder: $(System.DefaultWorkingDirectory)/TestResults
          mergeTestResults: true
          testRunTitle: All tests
          failTaskOnFailedTests: true

      - publish: $(Build.ArtifactStagingDirectory)/CoverageReport
        artifact: coverage-report
        displayName: Upload combined coverage report
        condition: succeededOrFailed()
